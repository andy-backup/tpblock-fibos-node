version: '1.0'
services:
  node-consensus:
    image: fibos-node:v5.0.3.0
    restart: always
    container_name: node-consensus
    volumes:
      - ../node_data/node_0:/node
      - ./resources:/app/resources
    ports:
      - "8870:8870"
      - "9870:9870"
    env_file:
      - ./resources/env.list
    entrypoint: ["sh", "/app/entrypoint.sh"] 
    command: ["node"]

  node-sync:
    image: fibos-node:v5.0.3.0
    restart: always
    container_name: fibos-node
    volumes:
      - ../node_data/data:/node/data
      - ./resources:/app/resources
    ports:
      - "8870:8870"
      - "9870:9870"
    env_file:
      - ./resources/sync.list
    # environment:
    #   - VIRTUAL_HOST=api.fibos.io,to-rpc.fibos.io
    #   - VIRTUAL_PORT=8870
    entrypoint: ["sh", "/app/entrypoint.sh"] 
    command: ["node"]

  node-wallet:
    image: fibos-node:v5.0.3.0
    restart: always
    container_name: fibos-wallet-node
    volumes:
      - ../node_data/data:/node/data
      - ./resources:/app/resources
    ports:
      - "8870:8870"
      - "9870:9870"
    env_file:
      - ./resources/wallet.list
    entrypoint: ["sh", "/app/entrypoint.sh"] 
    command: ["node"]